      - framework: quadriga-dlf
        competency: '5.1'
        level: 1
        note:
          de: Erhaltung historischer Bestände.
          en: Preservation of historical collections.
  - code: G278
    title: Archivkunde
    credits: 5
    category: wahlpflicht
    goals: Die Studentinnen/Studenten besitzen Kenntnisse über die verschiedenen archivalischen Quellengattungen und die Fähigkeit zu deren Identifizierung. Sie verfügen über Grundkenntnisse zur Organisationsstruktur des Archivwesens und zur Überlieferungsbildung sowie -erschließung in Archiven. Sie kennen die grundsätzlichen Anforderungen der Magazinierung, der Handhabung und des Bestandsschutzes von archivischen Beständen. Sie sind fähig, archivische von musealen Verfahrensweisen zu unterscheiden und Archive als Dienstleister wahrzunehmen sowie zu nutzen.
    topics:
      - Typologie und Organisation des deutschen Archivwesens
      - Quellenkundliche Grundlagen, archivalische Quellengattungen (Urkunden, Akten, Amtsbücher, Karten und Pläne, Selbstzeugnisse u.a.)
      - archivische Sammlungen (Zeitungen, Nachlässe, Fotografien und Filme, Plakate und Ansichtskarten, Stadtansichten u.a.), insbes. Bildmedien der Wirtschaft
      - 'Spezifik der Überlieferungsbildung in Archiven: Übernehmen, Bewerten, Erschließen'
      - digitale Archivinformationssysteme und Austauschformate
      - Bestandserhaltung und -schutz in Archiven
      - Archivtechnik, archivspezifische Verfahrensweisen der Magazinierung, Sicherungs- und Schutzverfilmung, Archivausstattung
      - Archivpädagogik/historische Bildungsarbeit in Archiven
    mappings:
      - framework: quadriga-dlf
        competency: '5.1'
        level: 2
        note:
          de: Archivkunde und Archivierung.
          en: Archival science and archiving.
      - framework: quadriga-dlf
        competency: '3.1'
        level: 1
        note:
          de: Ordnung und Erschließung archivalischer Bestände.
          en: Arrangement and description of archival collections.
  - code: G371
    title: Internationales Bibliotheks- und Informationswesen
    credits: 5
    category: wahlpflicht
    goals: Kenntnisse über das Bibliotheks- und Informationswesen einzelner Länder innerhalb und außerhalb Europas; Fähigkeit zur vergleichenden Analyse und Einordnung nationaler Traditionen und Besonderheiten der Organisation der Literaturversorgung in den behandelten Ländern.
    topics:
      - 'Das Eigene im Fremden: Comparative Librarianship vs. Alternative Konzepte zur Analyse der "Anderen"'
      - Wissenschaftliche und Öffentliche Bibliotheken sowie die Strukturen der nationalen Informationsversorgung in Frankreich, Großbritannien, Skandinavien, Spanien, Mittel- und Osteuropa sowie den USA
      - Die Rolle der Nationalbibliotheken sowie anderer zentraler Institutionen und Organisationen für die internationale Kooperation
      - Internationale Arbeitsgemeinschaften und Verbünde
      - Globalisierung der Informationsvermittlung und die internationale Zusammenarbeit von Bibliotheken
    mappings:
      - framework: quadriga-dlf
        competency: '5.3'
        level: 1
        note:
          de: Internationales Bibliotheks- und Informationswesen.
          en: International librarianship.
      - framework: quadriga-dlf
        competency: '1.3'
        level: 1
        note:
          de: Internationale Rahmenbedingungen.
          en: International frameworks.
  - code: G498
    title: Buchhandel/Verlagswirtschaft
    credits: 5
    category: vertiefung
    goals: Kenntnisse über Struktur und Arbeitsweise des herstellenden und verbreitenden Buchhandels sowie des Verlagswesens (Presse- und Buchverlage); Printmedienunternehmen als Verhandlungspartner verstehen; Grundlagenwissen zu wirtschaftlichen Prozessen in der Buch- und Medienbranche; Fähigkeit zu einfacher berufspraktischer Tätigkeit in Printmedienunternehmen (Buchverlage, Presseverlage, Handelsunternehmen); Fähigkeit zu einfacher berufspraktischer Tätigkeit in Unternehmen der Buchbranche.
    topics:
      - Einführung in grundlegende Strukturen und Tendenzen des Buchmarktes
      - Aufgaben und Bedeutung des Buch- und Pressehandels, Organisation der Branche
      - Verlagsleistungen und Prozesse (unter besonderer Berücksichtigung bibliothekswissenschaftlicher Fachverlage), Verlagsmanagement und -marketing
      - Leistungen und Arbeitsweise des verbreitenden Buchhandels, des Antiquariatsbuchhandels und des Online-Buchhandels
      - 'Publizieren und Distribuieren von Inhalten: kundenbedarfsgerecht (von Printmedien bis zu elektronischen Publikationsformen)'
      - 'Studienschwerpunkt: Literatur- und Medienvermittlung'
    mappings:
      - framework: quadriga-dlf
        competency: '5.2'
        level: 2
        note:
          de: Buchhandel und Verlagswirtschaft.
          en: Book trade and publishing industry.
      - framework: quadriga-dlf
        competency: '5.3'
        level: 1
        note:
          de: Wertschöpfungsketten des Publizierens.
          en: Publishing value chains.
  - code: G511
    title: Information - Gedächtnis - Kulturerbe
    credits: 5
    category: wahlpflicht
    goals: Die Studentinnen/Studenten kennen den aktuellen Diskussionsstand zu Metastrukturen für Archive, Bibliotheken und Museen, insbesondere zu deren konkurrierenden Theorieentwürfen bezüglich der Bewahrung und Vermittlung von Kulturgütern. Sie können ein reales Fallbeispiel hinsichtlich dessen Bezugnahme auf diese Metastrukturen untersuchen und deren Auswirkung auf das jeweilige Leistungsangebot beurteilen. Die Studentinnen/Studenten erwerben so die Kompetenz, ihr künftiges berufliches Handeln mit unterschiedlichen theoretischen Grundierungen zu versehen sowie die Relevanz und Akzeptanz dieser Haltung einzuschätzen.
    topics:
      - Charakteristika der drei Arten von Gedächtnisinstitutionen (Archive, Bibliotheken, Museen), Typologien dieser Institutionen, Abgrenzungsmerkmale, Hybridformen, internationale Ausprägungen
      - Dachorganisationen als Abbilder von institutionellen Metastrukturen der Gedächtnisinstitutionen (z. B. Deutscher Kulturrat, Blue Shield)
      - Definierende/Interessengruppen, Arbeitsprozesse, Leistungen, idealtypische Abgrenzungen von Informations- und Dokumentationseinrichtungen, Forschungsinfrastruktur, KulturellesGedächtnis-Institutionen, Kultureinrichtungen/kulturelle Infrastruktur, Kulturerbe-Institutionen, Gedenkstätten/historische Orte, Erinnerungsorte, Geschichtskultur, Institutionen für Kulturelle Bildung
      - Verhältnis der auf diese Konzepte bezogenen Theorien zu hergebrachten Vorstellungen von Archiv-, Bibliotheks- und Museumsarbeit und deren theoretischen Hintergründen
      - Konsequenzen aus der Zuordnung zu diesen Metastrukturen für das Leistungsprofil von Archiven, Bibliotheken und Museen
      - Überprüfung der Einwirkung der genannten Metastrukturen auf die Geschichte und die gegenwärtigen Handlungsfelder von Archiven, Bibliotheken oder Museen sowie deren gesellschaftliche Relevanz (in Fallstudien)
    mappings:
      - framework: quadriga-dlf
        competency: '5.3'
        level: 1
        note:
          de: Gedächtnisinstitutionen und kulturelles Erbe.
          en: Memory institutions and cultural heritage.
      - framework: quadriga-dlf
        competency: '1.3'
        level: 1
        note:
          de: Ethik und Recht des kulturellen Erbes.
          en: Ethics and law of cultural heritage.
  - code: G664
    title: Medienvermittlung
    credits: 5
    category: vertiefung
    goals: Die Studierenden erkennen die vermittelnde Funktion von Informationsdienstleistungen zwischen Bibliotheksbeschäftigten und -nutzenden. Die Studierenden wissen, mittels welcher Quellen, sie sich über die Entwicklung auf dem deutschen Sachbuchmarkt und in der internationalen Film-, Musik- und Gaming-Szene informieren können. Sie können Medien dieser Genres bewerten und Formate für deren Vermittlung entwickeln. Die Studierenden kennen die Besonderheiten der zielgruppenspezifischen Medienvermittlung in unterschiedlichen Bibliothekstypen.
    topics:
      - 'Marktsichtung und -analyse in den Genres: wissenschaftliche Literatur, Sachliteratur, Zeitungen und Zeitschriften, digitalen und Online-Medien einschließlich Streaming-Diensten, Film-, Musikmedien und Videospiele'
      - Bedarfsgerechte Medienauswahl und Bestandsentwicklung
      - Schulungen und Veranstaltungsformate für die Vermittlung von Medien
      - Medienvermittlung in wissenschaftlichen Spezialbibliotheken
      - Besondere Formen der Medienvermittlung in speziellen Bibliothekstypen wie mobilen Bibliotheken, Krankenhaus- oder Gefängnisbibliotheken
      - 'Studienschwerpunkt: Literatur- und Medienvermittlung'
    mappings:
      - framework: quadriga-dlf
        competency: '5.3'
        level: 2
        note:
          de: Medienvermittlung und didaktische Aufbereitung.
          en: Media dissemination and didactic preparation.
  - code: G775
    title: Kunstmarketing, Kunstverleih
    credits: 5
    category: wahlpflicht
    goals: Die Studentinnen/Studenten besitzen Kenntnisse der besonderen Rahmenbedingungen bildender Gegenwartskunst sowie einschlägiger Förderinstrumente. Sie kennen die rechtlichen und organisatorischen Besonderheiten der Artotheksarbeit. Die Studentinnen/Studenten besitzen die Fähigkeit, ein Artothek-Angebot zu planen und zu organisieren.
    topics:
      - Grundverständnis von bildender Kunst aus den Perspektiven der Produktion und Rezeption
      - Fachinformation (Gegenwarts-)Kunst
      - Bildende Kunst als Qualifikationsprofil, Werk und Lebensunterhalt
      - erwerbswirtschaftliche und gesellschaftsorientierte Formen der Kunstförderung, Kunstpräsentation und -vermittlung in Deutschland
      - 'Produktvarianz: Zweitfassungen, Multiples, Druckgrafik, Fotoabzug, Kunstdruck, 3D-Druck'
      - Absatzmärkte für bildende Kunst; das Kunstpublikum
      - Entwicklungsgeschichte, Zielsetzungen und Struktur des Kunstverleihs
      - Bestandsaufbau und -pflege, Verwaltung und Marketing öffentlich zugänglicher Artotheken
      - Differenzen in der Bestandserschließung und -bereithaltung gegenüber Bibliotheken und Museen
      - Rechtsfragen im Zusammenhang des Kunstverleihs
    mappings:
      - framework: quadriga-dlf
        competency: '5.3'
        level: 1
        note:
          de: Kunstmarketing und Kunstverleih.
          en: Art marketing and art lending.
      - framework: quadriga-dlf
        competency: '3.1'
        level: 1
        note:
          de: Vermarktung von Kulturgütern.
          en: Marketing of cultural goods.
  - code: G812
    title: Kinder- und Jugendliteratur
    credits: 5
    category: vertiefung
    goals: Die Studierenden kennen die Entwicklung und die Vielfalt der Genres und Themen in der Kinder- und Jugendliteratur; sind in der Lage, den Kinder- und Jugendbuchmarkt gezielt zu sichten und nach pädagogischen Gesichtpunkten geeignete Titel zu unterschiedlichen Themen auszuwählen und zu bewerten; können Kinder- und Jugendliteratur altersspezifisch vermitteln.
    topics:
      - Entwicklung der Kinder- und Jugendliteratur im deutschsprachigen Raum
      - Spezifika des Kinder- und Jugendbuchmarktes und Informationsquellen zur Marktsichtung
      - Ausgewählte Genres und Themen der Kinder- und Jugendliteratur, Gesichtspunkte für die Bewertung
      - Marktsichtung und Auswahl von Titeln der Kinder- und Jugendliteratur zu einem ausgewählten Thema für eine spezifische Altersgruppe
      - Formen der altersspezifischen Vermittlung, Methoden aus der Leseförderung und Medienpädagogik
      - 'Studienschwerpunkt: Kinder- und Jugendbibliotheksarbeit'
    mappings:
      - framework: quadriga-dlf
        competency: '5.3'
        level: 1
        note:
          de: Kinder- und Jugendliteratur.
          en: Literature for children and young adults.
  - code: G873
    title: Erschließungstechniken aus den Historischen Hilfswissenschaften
    credits: 5
    category: wahlpflicht
    goals: Die Studentinnen/Studenten verfügen über Überblickskenntnisse zu museumsrelevanten Historischen Hilfswissenschaften und ihren Quellengruppen. Sie haben Fähigkeiten und Fertigkeiten erworben, um Grundsätze und Methoden von ausgewählten Historischen Hilfswissenschaften bei der Bestimmung, der Datierung und Beschreibung von Musealien anzuwenden. Die Studentinnen/Studenten besitzen Überblickskenntnisse zur Schriftentwicklung seit der ausgehenden Antike und sind in der Lage, handschriftliche Dokumente ab dem späten 18. Jahrhundert zu lesen, zu transkribieren und zeitlich einzuordnen.
    topics:
      - Quellenbegriff der Historischen Hilfswissenschaften und der Geschichtswissenschaften; Überblick zu Quellengattungen verschiedener textlicher, bildlicher sowie dreidimensionaler Art
      - Gegenstand der Diplomatik und Aktenkunde
      - Überblickskenntnisse zur Siegelkunde (Spraghistik)
      - numismatische Grundbegriffe, wesentliche Etappen der Münzgeschichte, Abgrenzung zu Medaillen
      - Entwicklung des Wappenwesens, Terminologie der Heraldik
      - heraldische und genealogische Quellen
      - Orden des Mittelalters und der Frühen Neuzeit, modernes Auszeichnungswesen
      - Entwicklung und Gebrauch der Datierungsformen, Hilfsmittel der Historischen Chronologie
      - Schriftentwicklung von der Antike bis zum 20. Jahrhundert, materielle Grundlagen des Schreibens (Beschreibstoffe, Schreibwerkzeuge, Schreibstoffe)
      - Lesen und Transkribieren von handschriftlichen Dokumenten des 18. und 19. Jahrhunderts, Regeln der Transkription
