  - code: G807
    title: Methoden der Bibliotheks-und Informationswissenschaft
    credits: 5
    category: pflicht
    goals: Kenntnisse über Verlauf und Methoden des wissenschaftlichen Erkenntnisprozesses; Kenntnisse über die Methoden quantitativer und qualitativer Sozialforschung sowie ihre Anwendungsfälle in der Bibliotheks- und Informationswissenschaft; Kenntnisse, Fähigkeiten und Fertigkeiten zur Planung, Realisierung und Evaluierung einer quantitativen empirischen Untersuchung; sichere Anwendung der beschreibenden Statistik und der Software SPSS; Kenntnisse, Fähigkeiten und Fertigkeiten des Projektmanagements; Kenntnisse, Fähigkeiten und Fertigkeiten zur Entwicklung von Teamfähigkeit.
    topics:
      - Wissenschaftlicher Erkenntnisprozess und seine Phasen
      - Methoden des wissenschaftlichen Erkenntnisprozesses
      - Methoden der qualitativen und quantitativen Sozialforschung
      - Quantitative empirische Sozialforschung an einem Fallbeispiel
      - Grundbegriffe der beschreibenden Statistik, Auswertungsmethoden ein-, zwei- und mehrdimensionalen Datenmaterials
      - Standardsoftware SPSS, Berechnungen mit Echtdaten
      - Planung, Realisierung und Evaluierung einer quantitativen empirischen Untersuchung
    mappings:
