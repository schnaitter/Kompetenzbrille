      - 'Einblicke in die internationale Literaturentwicklung: Klassiker, zeitgenössische Literatur und Neuerscheinungen im Kontext ausgewählter Nationalliteraturen und Literaturdiskussionen'
      - Ausgewählte Genres der Unterhaltungsliteratur unter besonderer Berücksichtigung ihrer Bedeutung für Bibliotheken
      - Lektüre, Interpretation und Diskussion exemplarischer Werke
