          en: Subject information and retrieval in academic disciplines.
      - framework: quadriga-dlf
        competency: '5.2'
        level: 2
        note:
          de: Open Access und wissenschaftliches Publizieren.
          en: Open access and scholarly publishing.
      - framework: quadriga-dlf
        competency: '5.3'
        level: 2
        note:
          de: Zielgruppenspezifische Informationsvermittlung.
          en: Target-group-specific information provision.
  - code: G560
    title: 'Verbale und klassifikatorische Inhaltserschließung: Vertiefung'
    credits: 5
    category: vertiefung
    goals: 'Die Studierenden können: verschiedene Arten von Metatexten charakterisieren und vergleichen; höhere Merkmale und Inhalte ausgewählter Klassifikationen aus dem Bereich der öffentlichen und wissenschaftlichen Bibliotheken sowie des aktuellen Regelwerks für die Schlagwortkatalogisierung beschreiben und charakterisieren; in komplexeren Fällen Verfahren zur Inhaltsanalyse und -verdichtung anwenden; in komplexeren Fällen und in weiteren ausgewählten Sachgebieten Dokumenteninhalte durch Vergabe von Notationen und Schlagwörtern wiedergeben.'
    topics:
      - Charakteristika verschiedener Arten von Metatexten
      - Erstellung ausgewählter Arten von Metatexten
      - Anwendung von Methoden der Inhaltsanalyse und -verdichtung
      - Funktionen, Strukturelemente und Eigenschaften von Klassifikationen und kontrollierten Vokabularen
      - Methoden der Inhaltsrepräsentation mittels ausgewählter Klassifikationen und kontrollierterter Vokabulare und ihre Anwendung
      - 'Studienschwerpunkt: Informationserschließung und -vermittlung'
    mappings:
      - framework: quadriga-dlf
        competency: '3.2'
        level: 3
        note:
          de: Verbale und klassifikatorische Inhaltserschließung.
          en: Verbal and classificatory subject indexing.
      - framework: quadriga-dlf
        competency: '1.2'
        level: 1
        note:
          de: Inhaltsanalyse und -verdichtung.
          en: Content analysis and condensation.
  - code: G594
    title: Digitale Bibliotheken und Informationsportale
    credits: 5
    category: vertiefung
    goals: 'Die Studierenden können: wichtige digitale Bibliotheken und Informationsportale für verschiedene Nutzerkreise beschreiben und gegenüberstellen; Anforderungen und Tätigkeiten zur Erstellung von digitalen Bibliotheken und Informationsportalen darlegen; Theorien des Informationsverhaltens grundlegend erläutern; die Gebrauchstauglichkeit von digitalen Bibliotheken und Informationsportalen bewerten.'
    topics:
      - Informationsportale im weiteren Sinn, wie digitale und virtuelle Bibliotheken, nationalbibliographische Online-Angebote, Mediatheken
      - Angebote und Dienstleistungen von Informationsportalen
      - Organisationsformen und Arbeitsweise bei der Erstellung solcher Angebote
      - nutzerorientierte Anforderungen an Informationsportale; Modelle des Informationsverhaltens
      - 'Studienschwerpunkt: Informationserschließung und -vermittlung'
