    category: pflicht
    goals: Erkennen möglicher Profile von Bibliotheken und Einsicht in ihre Notwendigkeit; Einsicht in die Notwendigkeit kurz-, mittel- und langfristiger Zielgruppen-Strategien; Kenntnisse, Fähigkeiten und Fertigkeiten zur Bestimmung von Marktsegmenten in der konkreten Praxissituation; Kenntnisse, Fähigkeiten und Fertigkeiten zur Anwendung des Marketing-Mix auf ein Marktsegment und ein Produkt.
    topics:
      - Konzeptuelle Überlegungen zur Ausrichtung von Bibliotheksdienstleistungen auf den Absatzmarkt; Einflussfaktoren und Rahmenbedingungen
      - Absatzmarketing an Fallbeispielen von Bibliotheken unterschiedlichen Typs sowie einzelner Produkte (Produktmarketing)
      - Instrumentarien Segmentation, Gemeinwesenanalyse, Konkurrenzanalyse, StärkenSchwächen-Analyse
      - Exemplarische Anwendung der Instrumente des Marketing-Mix (Produkt-, Kommunikations-, Distributions- und Gegenleistungsgestaltung) auf ein Marktsegment an einem Fallbeispiel
      - Entwicklung eines Produktes an Fallbeispielen
