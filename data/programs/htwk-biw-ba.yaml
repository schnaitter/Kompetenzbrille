    goals: Die Studierenden haben Computer- und Videospiele kennengelernt und einen Überblick über verschiedene Spielertypen und Spielegenres erworben. Sie wissen, wie sich Computer- und Videospiele pädagogisch beurteilen lassen. Die Studierenden haben Medienkompetenz und die in neuen medialen Handlungsfeldern des Internets erforderlichen Rechtskenntnisse erworben. Die Studierenden haben Fähigkeiten zur Nutzung, Gestaltung und Herstellung interaktiver Medien im Hinblick auf die Durchführung von medienpädagogischen Projekten erworben.
