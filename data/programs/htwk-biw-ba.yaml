  - code: G748
    title: Strukturen und Ressourcen für Kultur- und Wissenschaftseinrichtungen
    credits: 5
    category: pflicht
    goals: Die Studierenden kennen die gesellschaftlichen, gesetzlichen und ökonomischen Rahmenbedingungen für Kultur- und Wissenschaftseinrichtungen. Sie besitzen die Kompetenz, ihre eigene künftige Position im Organisationsgefüge einzuschätzen, Wege der Einflussnahme zu bemerken und zu nutzen. Die Studierenden verfügen über die Kompetenz, sich mit dem betreffenden Personal- und Finanzmanagement über die Bedarfe einer Kultureinrichtung zu verständigen.
    topics:
      - Kultureinrichtungen zwischen der Erfüllung öffentlicher Aufgaben, gemeinnützigem und kulturwirtschaftlichem Engagement
      - gesetzliche, politische und volkswirtschaftliche Positionen zu gesellschaftlichen Finanzierungsbeiträgen für Kultur- und Wissenschaftseinrichtungen
      - Einordnung von Kultureinrichtungen in größere öffentlich-rechtliche Struktureinheiten (Aufbau der Landesverwaltungen; Kommunalverfassungen)
      - Entscheidungsstrukturen und Machtverhältnisse in den für Kultureinrichtungen relevanten Rechts- und Organisationsformen
      - Finanzierungsstrukturen der Öffentlichen Hand in Deutschland
      - Verfahren der internen und externen Kapital- und Sachmittelbeschaffung
      - Instrumente der Finanzplanung; Systeme des externen Rechnungswesens; Leistungsrechnung für Kultur
      - Grundzüge der Personalwirtschaft (Bedarfsermittlung, Kostenplanung, Personalbeschaffung und -entwicklung)
