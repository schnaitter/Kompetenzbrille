        level: 2
        note:
          de: Publikations- und Nachnutzungsplattformen.
          en: Publication and reuse platforms.
      - framework: quadriga-dlf
        competency: '5.1'
        level: 1
        note:
          de: Nachhaltige Verfügbarkeit digitaler Bestände.
          en: Sustainable availability of digital collections.
  - code: G547
    title: Metadaten und Metadatenmanagement
    credits: 5
    category: datenkompetenz
    goals: Die Studierenden kennen die für Bibliotheken relevanten Metadatenstandards, -dienste, und - schnittstellen und erlangen ein praktisches Verständnis von Aggregation, Organisation und Qualitätssicherung von Metadaten in GLAM-Einrichtungen und den Digital Humanities. Die Studierenden verstehen die Funktionsweise der Metadatenverarbeitung in bibliothekarischen Online-Katalogen und Discovery-Systemen. Sie sind in der Lage, Metadatenschemata für verschiedene Anwendungsbeispiele zu entwickeln. Die Studierenden kennen die wichtigsten Standards und Technologien zur Wissensmodellierung im Semantic Web und erlangen einen Überblick über die aktuellen Semantic-Web-Entwicklungen im informationswissenschaftlichen Bereich. Die Studierenden erarbeiten sich selbstständig vertiefte Kenntnisse einzelner Standards, Dienste oder Infrastrukturen und präsentieren diese im Seminar anschaulich und präzise.
    topics:
      - 'Metadaten: Definitionsversuche, Typen, Funktionen und Aufbau'
      - 'Bibliothekarische Metadatenformate und ihre Verwendung für die bibliographische Beschreibung: ERfassungs-, Intern-, Präsentations-, Austausch- und Normdatenformate'
      - 'Metadatenmanagement: Interoperabilität, Rechtemanagement, Qualitätsstandards'
      - 'Bibliothekarische Metadatendienste und ihre Schnittstellen: Aufgaben, Einsatzbereiche und Funktionsweisen'
      - 'Metadatenverwaltung: Aggregation, Migration und Datenerhaltung in bibliothekarischen Softwaresystemen'
      - Semantic-Web-Technologien und Linked Data
    mappings:
      - framework: quadriga-dlf
        competency: '3.2'
        level: 3
        note:
          de: Metadaten und Metadatenmanagement.
          en: Metadata and metadata management.
      - framework: quadriga-dlf
        competency: '5.2'
        level: 2
        note:
          de: Metadaten für Publikation und Nachnutzung.
          en: Metadata for publication and reuse.
      - framework: quadriga-dlf
        competency: '5.1'
        level: 2
        note:
          de: Metadaten für Langzeitarchivierung.
          en: Metadata for long-term archiving.
