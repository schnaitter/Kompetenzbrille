modules:
  - code: G311
    title: Formalerschließung spezieller Medientypen
    credits: 5
    category: vertiefung
    goals: Die Studierenden kennen die Standardelementen von Nichtbuchmedien und weiteren Ressourcen (z.B. Karten) im internationalen Regelwerk Resource Description and Access (RDA); sind in dert Lage, bibliographische Datensätze von unterschiedlichen Medientypen nach RDA anzufertigen; haben vertiefte Kenntnisse der computergestützten Formalerschließung in Bibliotheksverbünden und bei der Nutzung lokaler Bibliothekssoftware und Kenntnisse zu Normdatensätzen in der GND.
    topics:
      - Standardelemente für die Beschreibung von Nichtbuchmedien und weiteren Ressourcen (z.B. Karten) nach RDA
      - Bestandteile von bibliographischen Datensätzen für ausgewählte Nichtbuchmedien und weitere Ressourcen
      - Anfertigung bibliographischer Datensätze in der Katalogisierungssoftware von Bibliotheksverbünden (z.B. im B3Kat) und unter Nutzung lokaler Bibliothekssoftware (z.B. in Libero und BIBLIOTHECAplus)
      - Anfertigung von Normdatensätzen in der GND
      - 'Studienschwerpunkt: Informationserschließung und -vermittlung'
    mappings:
      - framework: quadriga-dlf
        competency: '3.2'
        level: 3
        note:
          de: Formalerschließung spezieller Medientypen nach RDA.
          en: Descriptive cataloguing of special media types according to RDA.
      - framework: quadriga-dlf
        competency: '2.3'
        level: 1
        note:
          de: Normdaten und bibliographische Datensätze.
          en: Authority data and bibliographic records.
  - code: G494
    title: Fachinformation ausgewählter Wissenschaftsdisziplinen
    credits: 5
    category: vertiefung
    goals: 'Die Studierenden können: Strukturen und Einrichtungen der Fachinformation ausgewählter Wissenschaftsdisziplinen beschreiben; die Auswirkungen des Wandels des wissenschaftlichen Publikationswesens auf die Fachinformation diskutieren; zielgruppenspezifischen Informationsbedarf analysieren; in wichtigen Informationsmitteln ausgewählter Wissenschaftsdisziplinen gezielte Recherchen durchführen; professionell zielgruppenspezifisch informationsvermittelnde Dienstleistungen konzipieren und erbringen.'
    topics:
      - Strukturen und Einrichtungen der Fachinformation ausgewählter Wissenschaftsdisziplinen
      - Kommunikationsstrukturen und Informationsbedarf in einzelnen Wissenschaften
      - bibliographische und faktographische Informationsmittel für ausgewählte Wissenschaftsdisziplinen
      - Open Access und Open Science und deren Einfluss für die wissenschaftliche Kommunikation
      - Mittel und Verfahren der Fachinformationsvermittlung an wissenschaftliche Nutzergruppen und die allgemeine Öffentlichkeit.
      - 'Studienschwerpunkt: Informationserschließung und -vermittlung'
    mappings:
