  - code: G131
    title: Literaturbewertung und -vermittlung
    credits: 5
    category: vertiefung
    goals: Die Studierenden verfügen über Kenntnisse und Fähigkeiten, Trends und Entwicklungen auf dem Literatur- und Medienmarkt zu beobachten und für die Bibliothek nutzbar zu machen; kennen bedeutsame literarische Titel und ausgewählte populäre Genres der Unterhaltungsliteratur als Voraussetzung für den Bestandsaufbau und die Benutzerberatung; können Literatur bewerten und zielgruppenspezifisch vermitteln.
