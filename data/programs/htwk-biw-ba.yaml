  - code: C603
    title: Grundlagen der Informatik
    credits: 5
    category: pflicht
    goals: Die Studierenden kennen den Aufbau, die grundlegenden Funktionsweisen und die Interaktionsarten moderner Computer und der auf ihnen installierten Softwarearten. Sie kennen die Unterschiede zwischen iOS-/Android-Geräten und Desktops/Laptops in der grundsätzlichen Handhabung. Sie sind befähigt, in der Beschaffung bzw. Bestandsverwaltung sachkundig über die Leistungsparameter von Computern und Computerzubehör zu urteilen. Mit der Nutzung der Standardsoftware Microsoft Office unter Microsoft Windows für Arbeitsprozesse sind sie in vertieftem Maße vertraut. Sie sind für Digitalisierungsprozesse, Datensicherheit, Ergonomie, Usability, User Experience und Barrierefreiheit sensibilisiert. Die Arbeitsabläufe in IT-gestützten Bibliotheksprozessen sind ihnen technologisch vertraut. Persönlich haben sie Selbstvertrauen im Umgang mit Computern erworben, das im Umgang mit Kunden zur Konzentration auf den Geschäftsprozess befähigt.
    topics:
      - Informationstechnologie mit Relevanz für Bibliotheken
      - Rechneraufbau nach dem EVA-Prinzip
      - Hardware der Verarbeitungseinheit
      - BIOS, Betriebssysteme, Anwendungssoftware
      - Speichereinheiten
      - Standardschnittstellen für Datentransfer und Multimedia
      - Digitale Daten, Einheiten, duale und hexadezimale Zahlen, typische Dateigrößen
      - Dateiformate für Text, Bild, Audio und Video
      - Computerbildschirme und Drucker
      - Tastaturen, Mäuse, Touchscreens
      - Netzwerke, Internet
      - 'Computersicherheit: Schutzaspekte, Hauptgefahren, Schutzmaßnahmen, Beispiele'
      - 'Ergonomie, Usability, User Experience, Barrierefreiheit: Grundlagen, Beispiele'
      - RFID-Technologien und Einsatz im Bibliotheksalltag
    mappings:
      - framework: quadriga-dlf
        competency: '2.3'
        level: 2
        note:
          de: Zeichenkodierungen, Dateiformate und Zahlensysteme.
          en: Character encodings, file formats and number systems.
      - framework: quadriga-dlf
        competency: '3.1'
        level: 1
        note:
          de: Aufbau und Arbeitsweise von Rechnern und Netzwerken.
          en: Structure and operation of computers and networks.
  - code: G469
    title: Typologie und Strukturen des deutschen Bibliotheks- und Informationswesens
    credits: 5
    category: pflicht
    goals: 'Die Studierenden können: gewinnen einen Überblick über die grundlegenden Voraussetzungen für die gegenwärtigen Aufgaben, Funktionen und Arbeitsweisen von Bibliotheken aller Typen sowie anderer informationsvermittelnder Einrichtungen in Deutschland und können die für das Themenfeld erforderliche Terminologie anwenden.; nutzen Basiskenntnisse zur Orientierung innerhalb der historisch gewachsenen und/oder funktional bestimmten Strukturen des deutschen Bibliotheks- und Informationswesens.; kennen und verstehen den grundlegenden rechtlichen und organisatorischen Rahmen, in dem Bibliotheken und Bibliothekssysteme, regionale und zentrale Institutionen, Organisationen, Verbände und Vereine im Bibliotheks- und Informationswesen arbeiten.; gewinnen Verständnis für das Konzept einer arbeitsteiligen überregionalen Literaturversorgung durch funktionsbezogene Kooperation.; lernen durch Themenfindung und -abgrenzung individuell zu erarbeitender Referate und deren mündliche und schriftliche Präsentation erste bibliothekstypologische Forschungsfragen zu formulieren und geeignete Methoden zu deren Beantwortung zu finden.'
    topics:
      - Das deutsche Bibliotheks- und Informationswesen im Kontext gesellschaftlich relevanter Strukturen und Aufgaben in Kultur, Wissenschaft und Bildung
      - Definitionskonzepte des Begriffs bzw. der Institution "Bibliothek" und davon bestimmte Rollen, Arbeitsweisen und Wirkungsfelder
      - Rechtsgrundlagen bibliothekarischer Dienstleistungen
      - Träger und Förderer des deutschen Bibliothekswesens und davon abhängige Funktionen der einzelnen Bibliothekstypen
      - Deskriptive funktionsorientierte Bibliothekstypologie und das System einer arbeitsteiligen Literatur- und Informationsversorgung durch funktionsbezogene bibliothekarische Kooperation
    mappings:
      - framework: quadriga-dlf
        competency: '3.2'
        level: 2
        note:
          de: Typologie und Strukturen des Bibliotheks- und Informationswesens.
          en: Typology and structures of the library and information system.
      - framework: quadriga-dlf
        competency: '1.1'
        level: 2
        note:
          de: Überblick über Informationsinfrastrukturen.
          en: Overview of information infrastructures.
  - code: G215
    title: Medientheorie und Medienkunde
    credits: 5
    category: pflicht
    goals: Grundlegende Kenntnis der Begriffe Kommunikation und Medien, ihrer Varietät und ihrer Bedeutungsebenen; Kenntnisse der theoretischen Grundlagen von Kommunikation; Umfassende Kenntnisse zur Typologie bibliothekarisch relevanter Medienarten und damit verknüpften Problemen hinsichtlich ihrer Erwerbung, Bewahrungund Vermittlung; Verständnis aktueller Entwicklungen des Medienmarktes und ihrer Konsequenzen für die Bibliotheken; Kenntnis der Möglichkeiten und Grenzen von Medienkonversion und Medientransfers; Grundkenntnisse zu bibliothekarisch relevanten Aspekten des Medien- und Informationsrechts.
    topics:
      - 'Kommunikation und Medien : Definition und Modelle'
      - 'Überblick über die Kommunikationsmittel Sprache, Bild und Schrift: Funktion, historischer Wandel, mediale Relevanz'
      - Grundlagenwissen zu Medienpolitik, Medienwirtschaft und Medienforschung
      - Typologie der Medien
      - Geschichte einzelner Medienarten und ihrer Nutzung
      - Print- und Nonprintmedien im Bestand Öffentlicher und Wissenschaftlicher Bibliotheken
      - Medienkonvergenz und Medientransfer aus bibliothekswissenschaftlicher Sicht
      - Überblick über das Medien- und Informationsrecht und seine bibliothekarisch relevanten Aspekte
    mappings:
      - framework: quadriga-dlf
        competency: '5.3'
        level: 1
        note:
          de: Medientheorie und Medienkunde als Vermittlungsgrundlage.
          en: Media theory and media studies as a basis for dissemination.
  - code: G456
    title: Grundlagen der Medienerschließung
    credits: 5
    category: pflicht
    goals: Beherrschung der fachbezogenen Terminologie; Kenntnis wesentlicher Methoden der Medien- und Bestandserschließung; Grundkenntnisse über Regelwerke und Standards der Formalerschließung; Fähigkeit zur Recherche in historischen Informationsressourcen, z.B. in nach den Regeln der Preußischen Instruktionen geordneten Zettel- und Imagekatalogen; Fähigkeit zur Anwendung alphabetischer Ordnungsprinzipien und -regeln; Überblickskenntnisse zur Inhaltserschließung.
    topics:
      - Die Funktion von Katalogen, Bibliographien und anderen Informationsressourcen
      - Historische und aktuelle Arten und Formen von Katalogen
      - Regelwerke und Standards zur formalen und inhaltlichen Medien- und Bestandserschließung im Überblick
      - das Library Reference Model der IFLA (IFLA-LRM)
      - Grundprinzipien der bibliographischen Beschreibung
      - Alphabetische Ordnungsprinzipien und -regeln
    mappings:
