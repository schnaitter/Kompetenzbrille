  - code: F978
    title: Latein zur Erschließung von Medien und Musealien
    credits: 5
    category: wahlpflicht
    goals: Grundkenntnisse der lateinischen Grammatik; Fähigkeit, dokumentarisch wichtige lateinische Begriffe und Abkürzungen auf historischen Objekten zu erkennen und zu verstehen.
    topics:
      - Grundregeln der Deklination und Konjugation im Lateinischen
      - Lesen kleiner Texte, Verständnisübungen zum Zusammenhang typischer Verbindungen und Wörter
      - Übersetzung einfacher lateinischer Inschriften an ausgewählten Beispielen
      - Dokumentarisch wichtige lateinische Begriffe, Wendungen und Abkürzungen (Eigentümer- und Urheberangaben, z.B. in der Druckgrafik; bibliographisch relevante Angaben auf Titelblättern und anderen formal bedeutsamen Stellen in älteren Büchern)
      - Lateinische Ziffern und Zahlen
      - Einführung in die kulturhistorischen Zusammenhänge der ausgewählten Textbeispiele
      - Tradition und Transformation lateinischer Wörter in den lebenden Sprachen in Einzelbeispielen (Fremdwörter und Abkürzungen im Deutschen; transformierte lateinische Wörter im Englischen)
    mappings:
      - framework: quadriga-dlf
        competency: '3.2'
        level: 2
        note:
          de: Lateinische Terminologie für die Erschließung.
          en: Latin terminology for indexing.
  - code: G075
    title: Kollaborative und automatisierte Inhaltserschließung
    credits: 5
    category: wahlpflicht
    goals: 'Die Studierenden können: automatisierten Verfahren der Inhaltserschließung erläutern, einsetzen und evaluieren; kollaborative Verfahren für nutzergenerierte Metadaten zur Verzeichnung von Medien verschiedener Gattungen diskutieren; die Verwendungsmöglichkeiten verschiedener Verfahren der Inhaltserschließung vergleichen; Kriterien für die Indexierungsqualität erläutern und entsprechende Qualitätsmaße berechnen.'
    topics:
      - Funktionsweise und bibliothekarische Anwendung automatisierter Verfahren der Inhaltserschließung
      - kollaborative Erschließungsverfahren wie social tagging, social cataloguing oder wissenschaftliche soziale Netzwerke
      - Vergleich verschiedener Methoden und Indexierungssprachen in der Anwendung in öffentlichen und wissenschaftlichen Bibliotheken
      - Qualitätsmaße für inhaltsbeschreibende Metadaten
    mappings:
      - framework: quadriga-dlf
        competency: '3.2'
        level: 3
        note:
