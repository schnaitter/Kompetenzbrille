  - code: U006
    title: Studium generale
    credits: 1
    category: pflicht
    goals: Im Studium generale sollen der fachübergreifende Charakter von Lehre und Forschung sowie die Zusammenhänge von Theorie und Praxis vermittelt werden. Der Studierende soll dabei befähigt werden, über sein eigenes Handeln zu reflektieren, sein Wissen einzuordnen und Zusammenhänge zu erkennen. Durch die offene und kontroverse Auseinandersetzung anhand eines ausgewählten Themas soll das Urteils- und Handlungsvermögen in politischen, ökonomischen, ökologischen und interkulturellen Bereichen ausgebildet werden.
    topics:
      - Im Studium Generale werden gesellschaftsrelevante Themen und wissenschaftlich/technologische Fragestellungen mit fachübergreifendem Charakter behandelt. Dabei soll der Blick auf die Funktions- und Kommunikationsmechanismen in unserer Gesellschaft geschärft werden. Die Bearbeitung eines Themas erfolgt aus möglichst unterschiedlichen Perspektiven. Zur Realisierung des Lernziels werden Lehrveranstaltungen mit unterschiedlichen Lehrinhalten angeboten, aus denen je nach Platzangebot frei gewählt werden kann.
    mappings:
      - framework: quadriga-dlf
        competency: '1.3'
        level: 1
