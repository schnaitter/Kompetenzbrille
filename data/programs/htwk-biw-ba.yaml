  - code: G426
    title: Benutzungsmanagement
    credits: 5
    category: pflicht
    goals: Einsicht in die Ziele Benutzerorientiertheit, Verfügbarkeit und Benutzbarkeit des Benutzungsmanagements; Kenntnisse der Organisationsmodelle von Freihand-, Magazin- und Präsenzbestand, der Ausleihorganisation sowie der Zusatzdienste und Services, Fähigkeit zur Prozessleitung in der bibliothekarischen Praxis; Kenntnisse über Evaluierungmöglichkeiten von Benutzungsmanagement und ihre Konsequenzen in der bibliothekarischen Praxis; Kenntnisse, Fähigkeiten und Fertigkeiten zur Anwendung von Schulungskomponenten zur Entwicklung von Bibliothekskompetenz.
