        competency: '1.2'
        level: 1
        note:
          de: Kriterien der Literaturauswahl.
          en: Criteria for literature selection.
  - code: G188
    title: Historische Bestände
    credits: 5
    category: wahlpflicht
    goals: Kenntnis der Grundsätze der Bestandserhaltung; Fähigkeit zum sachgerechten Umgang mit dem historischen Bestand; Fähigkeit zur Beurteilung von Schäden am Bibliotheksbestand; Kenntnis wesentlicher Maßnahmen der Bestandserhaltung zur Prävention und Behebung von Bestandsschäden; Kenntnis der Spezifik historischer Bestände und ihrer besonderen Anforderungen; Kenntnisse über Institutionen und Programme der Pflege historischer Bestände in Deutschland; Kenntnis grundlegender Informationsressourcen zum Nachweis alter Drucke und Fähigkeit zu ihrer professionellen Benutzung; Fähigkeit zur formalen Erschließung alter Drucke.
    topics:
