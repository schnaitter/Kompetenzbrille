id: hu-berlin-wf-ma
title: MA Wissenschaftsforschung
institution: Humboldt-Universität zu Berlin, Philosophische Fakultät
language: de
source: assets/AMB-40_2026_SPO_MA_Wissenschaftsforschung.pdf
sourceLabel: Fachspezifische Studien- und Prüfungsordnung (Amtliches Mitteilungsblatt Nr. 40/2026)
categories:
  - id: pflicht
    label: Pflicht
  - id: wahlpflicht
    label: Wahlpflicht
modules:
  - code: MP1
    title: Einführung in die Wissenschaftsforschung
    credits: 10
    category: pflicht
    goals: Die Student*innen kennen verschiedene Ansätze der Wissenschaftsforschung aus Soziologie, Ethnologie, Philosophie und Geschichte sowie dem interdisziplinären Feld der Science and Technology Studies. Die Student*innen können unterschiedliche Forschungsfragen der Wissenschaftsforschung einordnen und bewerten. Sie können zentrale methodische Probleme der Wissenschaftsforschung benennen und kennen unterschiedliche Zugänge zur Bearbeitung von Forschungsfragen der Wissenschaftsforschung.
    topics:
      - Zentrale Fragestellungen, Konzepte und Paradigmen der Wissenschaftsforschung
      - Wissenschaftstheoretische und epistemologische Perspektiven auf die Entstehung, Organisation und Bewertung von Wissen
      - Ansätze und Theorien zur gesellschaftlichen Einbettung des Wissenschaftssystems
      - Empirische Beobachtung, Analyse und Reflexion wissenschaftlicher Praxis
    mappings: []
  - code: MP2
    title: Methoden der Wissenschaftsforschung
    credits: 10
    category: pflicht
    goals: Die Student*innen erwerben ein grundlegendes Verständnis für zentrale Fragestellungen und die damit verbundenen methodischen Konzepte der Wissenschaftsforschung. Sie erhalten einen systematischen Überblick über die wichtigsten methodischen Zugänge (quantitative, qualitative, bibliometrische und netzwerkanalytische Verfahren) und können diese wissenschaftstheoretisch einordnen und bewerten. Auf Basis konkreter Forschungsfragen aus dem Bereich der Wissenschaftsforschung entwickeln die Student*innen eigenständig angemessene methodische Designs. Dabei lernen sie erkenntnistheoretische Grundpositionen kennen und können Forschungsmethoden hinsichtlich ihrer jeweiligen Möglichkeiten und Grenzen kritisch einschätzen.
    topics:
      - Einblick in den Methodenkanon der Wissenschaftsforschung
      - Überblick über typische Methodenkombinationen in der Wissenschaftsforschung
      - Anwendungsbeispiele
      - Fokussierung von Fragestellungen
      - Überblick über typische Forschungsdesigns
      - Einüben von Methoden anhand von Beispielen
    mappings:
      - framework: quadriga-dlf
        competency: "2.1"
        level: 1
        note:
          de: Methodische Designs für Forschungsfragen entwickeln (quantitative/qualitative/bibliometrische/netzwerkanalytische Erhebungen).
          en: Developing methodological designs for research questions (quantitative/qualitative/bibliometric/network-analytic studies).
      - framework: quadriga-dlf
        competency: "4.1"
        level: 2
        note:
          de: Systematischer Überblick über quantitative, qualitative, bibliometrische und netzwerkanalytische Verfahren.
          en: Systematic overview of quantitative, qualitative, bibliometric and network-analytic methods.
      - framework: quadriga-dlf
        competency: "4.3"
        level: 2
        note:
          de: Forschungsmethoden hinsichtlich ihrer Möglichkeiten und Grenzen kritisch einschätzen – Kern von 4.3.
          en: Critically assessing research methods with regard to their possibilities and limits – core of 4.3.
  - code: MP3
    title: Einführung in die Bibliometrie
    credits: 10
    category: pflicht
    goals: Die Student*innen erwerben Kompetenzen im reflexiven Umgang mit bibliometrischen und szientometrischen Verfahren unter Nutzung offener bibliographischer Dateninfrastrukturen. Sie erhalten einen systematischen Einblick in evaluative Verfahren zur Bewertung von Wissenschaft und Wissenschaftler*innen sowie in explorative Verfahren zur Kartierung und Aufdeckung von Dynamiken und Strukturen in Wissenschaftsfeldern. Darüber hinaus werden die Student*innen mit kurativen Verfahren vertraut gemacht und lernen, unterschiedliche Aspekte der Datenqualität bibliographischer Daten zu bewerten. Sie erwerben praktische Fertigkeiten im Umgang mit einschlägigen Web-Schnittstellen und in der statistischen Programmierung mit Schwerpunkt auf der Programmiersprache R.
    topics:
      - Grundzüge bibliographischer Datenbanken und ihrer Spezifika
      - Abdeckung und Datenqualität bibliographischer Daten
      - Grundlagen der evaluativen Bibliometrie
      - Grundlagen der explorativen Bibliometrie
      - Basiswissen der kurativen Bibliometrie
      - Reflexionswissen und Performativität bibliometrischer Verfahren
      - Anwendung evaluativer, explorativer und kurativer Verfahren
      - Einführung in statistische Programmierung (R)
      - Bibliometriegestützte Informationsbeschaffung
      - Disambiguierung und Harmonisierung von Metadaten
      - Visualisierung und Ergebnisinterpretation bibliometrischer Verfahren
    mappings:
      - framework: quadriga-dlf
        competency: "1.1"
        level: 2
        note:
          de: Offene bibliographische Dateninfrastrukturen; bibliometriegestützte Informationsbeschaffung; Umgang mit Web-Schnittstellen.
          en: Open bibliographic data infrastructures; bibliometrics-based information retrieval; working with web interfaces.
      - framework: quadriga-dlf
        competency: "1.2"
        level: 2
        note:
          de: Datenqualität bibliographischer Daten bewerten (Abdeckung, Disambiguierung).
          en: Assessing the data quality of bibliographic data (coverage, disambiguation).
      - framework: quadriga-dlf
        competency: "2.3"
        level: 2
        note:
          de: Kurative Verfahren; Disambiguierung und Harmonisierung von Metadaten.
          en: Curative procedures; disambiguation and harmonisation of metadata.
      - framework: quadriga-dlf
        competency: "4.1"
        level: 3
        note:
          de: Evaluative und explorative bibliometrische Verfahren; statistische Programmierung mit R.
          en: Evaluative and explorative bibliometric methods; statistical programming with R.
      - framework: quadriga-dlf
        competency: "4.2"
        level: 2
        note:
          de: Visualisierung bibliometrischer Verfahren.
          en: Visualisation of bibliometric procedures.
      - framework: quadriga-dlf
        competency: "4.3"
        level: 2
        note:
          de: Ergebnisinterpretation; Reflexionswissen und Performativität bibliometrischer Verfahren.
          en: Interpretation of results; reflexive knowledge and performativity of bibliometric procedures.
  - code: MP4
    title: Wissenschaft organisieren und gestalten
    credits: 10
    category: pflicht
    goals: Die Student*innen erwerben fundierte Kenntnisse über die gesellschaftliche Einbettung des Wissenschaftssystems und verstehen die komplexen Wechselwirkungen und Interaktionsformen der Wissenschaft mit anderen gesellschaftlichen Teilbereichen wie Medien, Politik und Wirtschaft. Sie setzen sich intensiv mit den Institutionen und Verfahren des Wissenstransfers auseinander. Darauf aufbauend entwickeln die Student*innen ein differenziertes Verständnis für die vielschichtigen Legitimations-, Gestaltungs- und Steuerungsmuster der Wissenschaft und werden befähigt, eigenständig Forschungsfragen in diesem Themenbereich zu entwickeln.
    topics:
      - Grundlegende Steuerungs- und Legitimationsmuster der Wissenschaft
      - Historische und aktuelle Formen der Wechselwirkung zwischen Wissenschaft und Gesellschaft
      - Kritische Analyse institutioneller Arrangements und Steuerungsinstrumente
      - Institutionen und Verfahren des Wissenstransfers
    mappings:
      - framework: quadriga-dlf
        competency: "5.3"
        level: 1
        note:
          de: Institutionen und Verfahren des Wissenstransfers (Wissenschaftskommunikation in die Gesellschaft).
          en: Institutions and procedures of knowledge transfer (science communication to society).
  - code: MP5
    title: Projektmodul
    credits: 10
    category: pflicht
    goals: Projektmodule dienen der problembezogenen Vertiefung fachwissenschaftlicher Kenntnisse und Methoden. Die Student*innen sind in der Lage, eine größere Aufgabenstellung in Abstimmung mit den beteiligten Mitstudent*innen und unter Anleitung der Lehrer*innen zu bearbeiten. Neben den jeweils fachlichen haben sie sich während der Projektarbeit auch überfachliche Qualifikationen (z. B. Entwicklung von Teamfähigkeit, Kommunikationsfähigkeit, Zeitmanagement) angeeignet.
    topics:
      - Fokussierung auf eine Fragestellung aus der Forschung und Praxis
      - Planung von Forschungsdesigns
      - Erstellen eines geeigneten Arbeits- und Zeitplans
      - Techniken zur Dokumentation von Verfahren und Ergebnissen
    mappings:
      - framework: quadriga-dlf
        competency: "3.1"
        level: 1
        note:
          de: Projektorganisation inkl. Arbeits- und Zeitplan, Dokumentation; Datenbezug hängt vom Projektthema ab.
          en: Project organisation incl. work and time schedule, documentation; the data aspect depends on the project topic.
  - code: MP6
    title: Praktikum
    credits: 10
    category: pflicht
    goals: Das Praktikum im Masterstudiengang Wissenschaftsforschung verfolgt das Ziel, den Student*innen einen vertieften Einblick in die Praxis wissenschaftsbezogener Arbeitsfelder zu ermöglichen. Es soll Student*innen befähigen, ihr im Studium erworbenes theoretisches Wissen auf konkrete Fragestellungen, Problemlagen und Organisationszusammenhänge anzuwenden und dabei ihre methodischen, analytischen und kommunikativen Kompetenzen weiterzuentwickeln. Student*innen lernen Organisationen kennen, in denen wissenschaftsbezogene Forschung, Politikberatung, Evaluation, Wissenschaftsmanagement oder Wissenschaftskommunikation betrieben werden.
    topics:
      - Forschungsinstitutionen mit Bezug zur Wissenschaftsforschung
      - Institutionen der Wissenschaftsförderung und -verwaltung
      - Forschungsstarke Unternehmen und Institutionen der wissenschaftlichen Politikberatung
      - Dokumentation des Praktikums
    mappings: []
  - code: MP7
    title: Masterarbeit und Verteidigung
    credits: 30
    category: pflicht
    goals: Die Studierenden weisen die Befähigung zum selbständigen wissenschaftlichen Arbeiten durch die schriftliche Bearbeitung einer Problemstellung aus der Wissenschaftsforschung nach. Bei der Anfertigung der Masterarbeit erhalten die Studierenden Unterstützung in einem obligatorischen Begleitcolloquium, in dem sie lernen, ihre Fragestellung methodisch umzusetzen und in dem sie den Entwurf ihrer Arbeit erörtern können.
    topics:
      - Masterarbeitsthemen aus aktuellen Forschungsschwerpunkten bzw. Problemkontexten der Wissenschaftsforschung
      - "Begleitcolloquium: methodische Umsetzung der Fragestellung"
      - Masterarbeit und Verteidigung
    mappings:
      - framework: quadriga-dlf
        competency: "5.3"
        level: 2
        note:
          de: Schriftliche Bearbeitung einer Forschungsfrage und Verteidigung – zielgruppenspezifische Kommunikation von Forschungsergebnissen; Datenbezug hängt vom Thema ab.
          en: Written treatment of a research question and defense – audience-specific communication of research findings; the data aspect depends on the topic.
  - code: MWP1
    title: Wissenschaftsethnographie
    credits: 10
    category: wahlpflicht
    goals: Die Student*innen erwerben die Fähigkeit, wissenschaftliche Erkenntnisprozesse in ihren technischen, sozialen und politischen Verflechtungen ethnographisch zu erforschen und zu analysieren. Im Mittelpunkt stehen dabei die Praktiken und die Situiertheit von Wissensproduktion und -aushandlung in gesellschaftlich relevanten Feldern. Das Modul vermittelt ein Verständnis von Wissenschaft als soziotechnische Praxis, in der Akteure, Artefakte, Diskurse und Technologien ko-konstituiert werden.
    topics:
      - Sozialanthropologische Ansätze der Wissenschafts- und Technikforschung
      - Theorien und Konzepte der Technik- und Infrastrukturbindung von Wissen
      - Ethnografische Zugänge zu Medien, Praktiken und Infrastrukturen
      - Feministische, postkoloniale und dezoloniale Perspektiven
    mappings:
      - framework: quadriga-dlf
        competency: "2.1"
        level: 2
        note:
          de: Ethnographische Erhebungsmethoden (Feldforschung, Beobachtung) als Datenerhebung.
          en: Ethnographic methods (field research, observation) as data collection.
      - framework: quadriga-dlf
        competency: "4.1"
        level: 1
        note:
          de: Ethnographisches Erforschen und Analysieren wissenschaftlicher Erkenntnisprozesse.
          en: Ethnographic investigation and analysis of scientific knowledge processes.
  - code: MWP2
    title: Wissenschaftsphilosophie
    credits: 10
    category: wahlpflicht
    goals: Die Student*innen kennen spezifische philosophische Probleme, Theorieansätze und Argumente, die für die Wissenschaftsforschung relevant sind, insbesondere solche aus philosophischer Wissenschafts- und Erkenntnistheorie. Sie entwickeln ein reflektiertes Verständnis der Bedingungen und Grenzen verlässlichen Wissens angesichts der Pluralität und Komplexität moderner Wissenschaften, und sie lernen, wissenschaftliches Wissen auf seine erkenntnistheoretischen, methodologischen und metaphysischen Voraussetzungen hin zu befragen.
    topics:
      - Philosophische Wissenschafts- und Erkenntnistheorie
      - Bedingungen und Grenzen verlässlichen Wissens
      - Erkenntnistheoretische, methodologische und metaphysische Voraussetzungen wissenschaftlichen Wissens
    mappings:
      - framework: quadriga-dlf
        competency: "4.3"
        level: 1
        note:
          de: Reflexion der Bedingungen und Grenzen verlässlichen Wissens – erkenntnistheoretische Seite von Aussagekraft und Einschränkungen.
          en: Reflecting the conditions and limits of reliable knowledge – epistemological side of significance and limitations.
  - code: MWP3
    title: Hochschulforschung
    credits: 10
    category: wahlpflicht
    goals: Die Student*innen können, aufbauend auf den erworbenen wissenschaftlichen Methodenkompetenzen, wissenschaftliche Fragestellungen eigenständig bearbeiten, die Ergebnisse auswerten und darstellen. Sie haben Kenntnisse zu ausgewählten theoretischen Konzepten und Methoden sowie der damit verbundenen Diskurse zum Zusammenspiel von Wissenschaft, Hochschule und Bildung erworben.
    topics:
      - Grundlegende Kenntnisse empirischer Hochschulforschung
      - Lektüre und kritische Reflexion ausgewählter theoretischer Konzepte
      - Erarbeitung analytisch fundierter Fragestellungen
      - Ausgewählte empirische Entwicklungen im Feld der Hochschule
    mappings:
      - framework: quadriga-dlf
        competency: "4.1"
        level: 1
        note:
          de: "Empirische Hochschulforschung: Ergebnisse auswerten."
          en: "Empirical higher-education research: evaluating results."
      - framework: quadriga-dlf
        competency: "5.3"
        level: 1
        note:
          de: Ergebnisse darstellen und berichten.
          en: Presenting and reporting results.
  - code: MWP4
    title: Wissenschaftsgeschichte
    credits: 10
    category: wahlpflicht
    goals: Im Zentrum der Ausbildung in der Wissenschaftsgeschichte steht die Herausbildung der modernen Wissenschaft. Student*innen lernen Wissenschaft als sowohl historisch kontingente als auch historisch situierte Form der Weltaneignung und kulturgeleitete Wirklichkeitsproduktion zu begreifen und als Prozess zu analysieren.
    topics:
      - Exemplarisch vertiefendes Wissen zur Geschichte der modernen Wissenschaft
      - Selbständige Herangehensweisen an wissenschaftshistorische Quellenbestände
      - Spezifika der Quellenbestände und methodische Herangehensweisen
    mappings: []
  - code: MWP5
    title: Informationswissenschaft
    credits: 10
    category: wahlpflicht
    goals: Die Student*innen kennen spezifische Theorien, Methoden und Strömungen der Informationswissenschaft und können diese anwenden, wobei Möglichkeiten der Nutzung, Organisation und der Repräsentation von Informationen im Vordergrund stehen. Sie kennen zentrale Prinzipien der Planung und Durchführung von Forschungsdesigns zur Bearbeitung informationswissenschaftlicher Forschungsfragen und haben einige Instrumente an Beispielen angewandt. Sie sind dadurch in der Lage, eigene informationswissenschaftliche Studien durchzuführen.
    topics:
      - Informationswissenschaftliche Theorien und Strömungen
      - Organisation, Analyse von und Interaktion mit Informationsinfrastrukturen (z.B. Bibliotheken, Forschungsinformationen)
      - Open Science
      - Ethik und Governance von Information und Informationsinfrastrukturen
      - Quantitative und qualitative Forschungsmethoden der Informationswissenschaft
      - Konzeption und Durchführung informationswissenschaftlicher Forschungsdesigns
      - Analyse, Evaluation und Reflektion von Informationsprozessen und -praktiken
    mappings:
      - framework: quadriga-dlf
        competency: "1.1"
        level: 1
        note:
          de: Organisation, Analyse von und Interaktion mit Informationsinfrastrukturen.
          en: Organisation, analysis of and interaction with information infrastructures.
      - framework: quadriga-dlf
        competency: "1.3"
        level: 2
        note:
          de: Ethik und Governance von Information und Informationsinfrastrukturen.
          en: Ethics and governance of information and information infrastructures.
      - framework: quadriga-dlf
        competency: "2.1"
        level: 1
        note:
          de: Quantitative und qualitative Forschungsmethoden; Konzeption und Durchführung von Forschungsdesigns.
          en: Quantitative and qualitative research methods; conception and conduct of research designs.
      - framework: quadriga-dlf
        competency: "4.1"
        level: 1
        note:
          de: Analyse, Evaluation und Reflektion von Informationsprozessen und -praktiken.
          en: Analysis, evaluation and reflection of information processes and practices.
  - code: MWP6
    title: Aktuelle Themen und Theorien der Wissenschaftsforschung
    credits: 10
    category: wahlpflicht
    goals: Die Student*innen haben sich mit spezifischen Forschungsansätzen der Wissenschaftsforschung vertieft auseinandergesetzt. Sie sind in der Lage, den Forschungsstand im Fachgebiet einzuordnen und Forschungsergebnisse kritisch zu analysieren. Das erworbene Reflexionswissen erlaubt Student*innen unterschiedliche, z.T. auch konkurrierende, Theoriestänge differenziert einzuordnen und auf aktuelle Themen anzuwenden.
    topics:
      - Überblick über aktuelle theoriegeleitete Debatten der Wissenschaftsforschung
      - Theorieentwicklung in der Wissenschaftsforschung
      - Analyse aktueller Herausforderungen
      - Kritische Reflexion wissenschaftspolitischer Entwicklungen
    mappings: []
  - code: MWP7
    title: Fortgeschrittene Methoden der Wissenschaftsforschung
    credits: 10
    category: wahlpflicht
    goals: Die Student*innen haben ihre methodischen Kenntnisse in der Wissenschaftsforschung vertieft. Aufbauend auf den erworbenen methodischen Kompetenzen der Einführungsveranstaltungen sind sie in der Lage, mit speziellen methodischen Instrumenten spezifische Fragestellungen zu bearbeiten. Dabei haben sich die Student*innen im Rahmen eines speziellen Forschungsseminars mit einer für die Wissenschaftsforschung besonders relevanten Methode vertieft auseinandergesetzt.
    topics:
      - Aktuelle methodologische Debatten der quantitativen Wissenschaftsforschung
      - Anwendung avancierter Verfahren zur Untersuchung wissenschaftlicher Kommunikation und Zusammenarbeit
      - Kritischer Umgang mit Formen der Evaluation von Wissenschaft inkl. wissenschaftspolitischer Bezüge
      - Eigenständiges Entwickeln und Umsetzen kleiner empirischer Projekte im Bereich quantitativer Wissenschaftsforschung
      - Fortgeschrittene qualitative, rekonstruktive Zugänge in der Wissenschaftsforschung
      - Analyse wissenschaftlicher Praktiken, Diskurse und Institutionen (z.B. Interviews, Fallstudien, Dokumentenanalysen)
      - Erhebung und Auswertung qualitativer Daten
    mappings:
      - framework: quadriga-dlf
        competency: "2.1"
        level: 2
        note:
          de: Eigenständiges Umsetzen kleiner empirischer Projekte; Interviews, Fallstudien, Dokumentenanalysen als Erhebungen.
          en: Independently implementing small empirical projects; interviews, case studies, document analyses as data collection.
      - framework: quadriga-dlf
        competency: "4.1"
        level: 2
        note:
          de: Anwendung avancierter Verfahren zur Untersuchung wissenschaftlicher Kommunikation und Zusammenarbeit; fortgeschrittene qualitative, rekonstruktive Zugänge.
          en: Applying advanced methods to study scholarly communication and collaboration; advanced qualitative, reconstructive approaches.
      - framework: quadriga-dlf
        competency: "4.3"
        level: 1
        note:
          de: Kritischer Umgang mit Formen der Evaluation von Wissenschaft.
          en: Critical handling of forms of science evaluation.
