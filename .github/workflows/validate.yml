name: Validate data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # required for checkout (explicit permissions drop implicit defaults)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, needed for per-commit validation on PRs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On pull requests, validate every individual commit (not just the tip),
      # so the branch history stays bisectable. Commits that predate the
      # validator are skipped with a warning instead of failing the job.
      # The final checkout returns to the tip, which the steps below then
      # validate (again, but only once per event — no job-level duplication).
      - name: Validate each commit of the pull request
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          commits=$(git rev-list --reverse "$base..$head")
          if [ -z "$commits" ]; then
            echo "No commits in range $base..$head — nothing to validate."
            exit 0
          fi
          status=0
          for c in $commits; do
            git checkout --quiet --detach "$c"
            subject=$(git log -1 --format=%s "$c")
            if [ ! -f scripts/validate-data.js ]; then
              echo "::warning file=scripts/validate-data.js::commit $c ($subject) predates the validator — skipped"
              continue
            fi
            echo "Validating $c — $subject"
            if ! node scripts/validate-data.js > /tmp/validate.log 2>&1; then
              echo "::error::validation failed for commit $c ($subject)"
              cat /tmp/validate.log
              status=1
            fi
          done
          git checkout --quiet --detach "$head"
          exit $status

      - name: Validate data files (JSON Schema + cross-references)
        run: node scripts/validate-data.js

      - name: Regenerate JSON-LD serializations
        run: node scripts/yaml-to-jsonld.js

      - name: Check JSON-LD serializations are up to date
        run: |
          if ! git diff --exit-code data/jsonld/; then
            echo "::error::data/jsonld/ is out of date — run 'node scripts/yaml-to-jsonld.js' and commit the result."
            exit 1
          fi

      - name: Regenerate favicon from assets/logo.svg
        run: node scripts/svg-to-favicon.js

      - name: Check favicon is up to date
        run: |
          if ! git diff --exit-code assets/favicon.ico; then
            echo "::error::assets/favicon.ico is out of date — run 'npm run favicon' and commit the result."
            exit 1
          fi
