name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # required for checkout (explicit permissions drop implicit defaults)

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: npx http-server . -p 4173 -c-1 --silent &

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:4173/index.html

      # Blocking: scans compare against the committed baselines in
      # tests/a11y/baselines/. New violations (or unreviewed baseline drift)
      # fail the job. Update baselines deliberately via
      # `npm run test:a11y:baseline` and commit them with the fix.
      - name: Run WCAG 2.2 AA scans
        run: npm run test:a11y

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: results/

      - name: Static HTML validation
        run: npm run test:html
