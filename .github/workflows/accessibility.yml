name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # required for checkout (explicit permissions drop implicit defaults)

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: npx http-server . -p 4173 -c-1 --silent &

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:4173/index.html

      # Phase 0: report-only. Remove continue-on-error once baselines are
      # committed (issue #58, phase 1) so new violations block the PR/main.
      - name: Run WCAG 2.2 AA scans
        run: npm run test:a11y
        continue-on-error: true

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: results/
