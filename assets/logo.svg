  <!-- modules as small squares -->
  <g fill="#ffffff">
    <rect x="12.5" y="40" width="7" height="5" rx="1.2"/>
    <rect x="28.5" y="40" width="7" height="5" rx="1.2"/>
    <rect x="44.5" y="40" width="7" height="5" rx="1.2"/>
    <rect x="12.5" y="49.7" width="7" height="5" rx="1.2"/>
    <rect x="28.5" y="49.7" width="7" height="5" rx="1.2"/>
    <rect x="44.5" y="49.7" width="7" height="5" rx="1.2"/>
  </g>
  <!-- glasses looking at the table -->
  <g fill="none" stroke="#ffffff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20.5" cy="16" r="8"/>
    <circle cx="43.5" cy="16" r="8"/>
    <path d="M26.5 10 Q32 6.8 37.5 10"/>
    <path d="M13.03 13.15 9.5 11.8"/>
    <path d="M50.97 13.15 54.5 11.8"/>
